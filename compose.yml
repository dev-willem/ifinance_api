# iFinance API — Docker Compose
#
# Modo dev (profile docker):
#   docker compose --profile docker up --build
#   → Backend :8080 | DB :5432
#
# Modo produção (profile prod):
#   docker compose --profile prod up -d
#   → Backend :8080 (somente 127.0.0.1, atrás de Nginx/TLS no host) | DB isolado sem porta exposta
#   → Frontend roda à parte (repo github.com/dev-willem/ifinance, publicado na Vercel)
#
# Ver DEPLOY.md para o passo a passo completo de produção.

services:

  # ── Banco de dados — dev ──────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ifinance_dev}
      POSTGRES_USER: ${DB_USERNAME:-ifinance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ifinance}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ifinance}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles:
      - docker

  # ── Banco de dados — prod ─────────────────────────────────
  db-prod:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles:
      - prod

  # ── Backend — build local (dev) ───────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME:-ifinance}
      DB_PASSWORD: ${DB_PASSWORD:-ifinance}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:7000}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:7000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    profiles:
      - docker

  # ── Backend — imagem registry (prod) ─────────────────────
  backend-prod:
    image: ${BACKEND_IMAGE:-ghcr.io/dev-willem/ifinance-backend:latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db-prod
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL}
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:?GOOGLE_REDIRECT_URI é obrigatório em prod (ex. https://api.seudominio.com/login/oauth2/code/google)}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127\\.0\\.0\\.1|::1}"
      SERVER_PORT: 8080
    ports:
      # Publicado apenas em loopback: só o Nginx/reverse proxy do host alcança o backend.
      # O tráfego externo direto na porta 8080 fica bloqueado a nível de SO.
      - "127.0.0.1:8080:8080"
    depends_on:
      db-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    profiles:
      - prod

volumes:
  postgres_data:
  postgres_prod_data:
