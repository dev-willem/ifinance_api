# Perfil prod — toda configuração via variáveis de ambiente
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            # Sem fallback para {baseUrl}: em prod o valor é sempre explícito (não deriva do Host da requisição).
            redirect-uri: ${GOOGLE_REDIRECT_URI}
        provider:
          google:
            issuer-uri: https://accounts.google.com

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=60m

  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.willembergfilho.ifinance: INFO

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Só confia em X-Forwarded-* quando a requisição chega do proxy do host (Nginx/TLS).
      # O backend só é publicado em 127.0.0.1 (ver docker-compose.yml), então a origem
      # legítima do hop imediato é sempre o loopback — nada além disso deve ser aceito.
      internal-proxies: "${TRUSTED_PROXIES:127\\.0\\.0\\.1|::1}"
  servlet:
    session:
      cookie:
        # None é obrigatório aqui: frontend (Vercel) e backend (Oracle/DuckDNS) ficam em
        # domínios diferentes, então o cookie de sessão só é enviado em chamadas cross-site
        # se SameSite=None + Secure. Exige HTTPS em ambos os lados (já garantido pelo Nginx/Let's Encrypt).
        same-site: none
        secure: true
