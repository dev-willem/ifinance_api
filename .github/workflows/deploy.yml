name: Deploy — Produção

on:
  workflow_run:
    workflows: ["CI — Backend"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_image:
        description: 'Tag da imagem backend (ex: sha-abc1234)'
        required: false
        default: 'latest'

jobs:
  deploy:
    name: Deploy para servidor de produção
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Adicionar host ao known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Copiar compose.yml para servidor
        run: |
          scp compose.yml ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/compose.yml

      - name: Deploy
        env:
          BACKEND_TAG: ${{ github.event.inputs.backend_image || 'latest' }}
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Atualizar imagem
            docker compose --profile prod pull

            # Subir com zero-downtime (replace)
            docker compose --profile prod up -d --remove-orphans

            # Limpar imagens antigas
            docker image prune -f
          ENDSSH

      - name: Verificar health
        run: |
          sleep 20
          # O backend publica a porta 8080 apenas em 127.0.0.1 do servidor (ver compose.yml),
          # portanto o health check precisa rodar dentro do host via SSH, não pela internet.
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'curl --fail --silent --retry 5 --retry-delay 10 http://127.0.0.1:8080/actuator/health | grep -q "\"status\":\"UP\""' \
            && echo "Backend UP" || (echo "Health check falhou" && exit 1)
